name: pkg.pr.new Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
      - "canary/**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vmm-darwin-arm64:
    if: github.repository == 'ScriptedAlchemy/machinen'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Restore cached VMM
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          key: vmm-darwin-arm64-${{ hashFiles('packages/microvm/src/**', 'packages/microvm/assets/**/*.zig', 'packages/microvm/build.zig', 'packages/microvm/build.zig.zon', 'packages/microvm/entitlements.plist') }}
      - name: Setup Zig
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - name: Ad-hoc codesign with hypervisor entitlement
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/microvm
        run: |
          codesign -s - --force \
            --entitlements entitlements.plist \
            zig-out/bin/machinen-vm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-arm64-darwin
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error
          retention-days: 7

  build-vmm-arm64-linux:
    if: github.repository == 'ScriptedAlchemy/machinen'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM (linux-arm64, native)
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-arm64-linux
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error
          retention-days: 7

  build-vmm-x64-linux:
    if: github.repository == 'ScriptedAlchemy/machinen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build VMM (linux-x64, native)
        working-directory: packages/microvm
        run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vmm-x64-linux
          path: |
            packages/microvm/zig-out/bin/machinen-vm
          if-no-files-found: error
          retention-days: 7

  build-base-assets:
    if: github.repository == 'ScriptedAlchemy/machinen'
    uses: ./.github/workflows/_build-base-assets.yml

  publish:
    if: github.repository == 'ScriptedAlchemy/machinen'
    needs:
      - build-vmm-darwin-arm64
      - build-vmm-arm64-linux
      - build-vmm-x64-linux
      - build-base-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          version: 10.30.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-arm64-darwin
          path: packages/native-arm64-darwin/vmm/bin/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-arm64-linux
          path: packages/native-arm64-linux/vmm/bin/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vmm-x64-linux
          path: packages/native-x64-linux/vmm/bin/
      - run: chmod +x packages/native-{arm64-darwin,arm64-linux,x64-linux}/vmm/bin/machinen-vm

      - name: Bundle gvproxy
        run: |
          set -euo pipefail
          scripts/install-gvproxy.sh --os darwin --dest packages/native-arm64-darwin/vmm/bin
          scripts/install-gvproxy.sh --os linux  --arch arm64 --dest packages/native-arm64-linux/vmm/bin
          scripts/install-gvproxy.sh --os linux  --arch amd64 --dest packages/native-x64-linux/vmm/bin

      - name: Download arm64 base assets (for guest binaries)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-assets-arm64
          path: ${{ runner.temp }}/release-assets-arm64/
      - name: Download amd64 base assets (for guest binaries)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: base-assets-amd64
          path: ${{ runner.temp }}/release-assets-amd64/
      - name: Stage guest binaries into native packages
        run: |
          set -euo pipefail
          arm64_assets="${RUNNER_TEMP}/release-assets-arm64"
          amd64_assets="${RUNNER_TEMP}/release-assets-amd64"

          for pkg in packages/native-arm64-darwin packages/native-arm64-linux; do
            mkdir -p "$pkg/vmm/guest"
            cp "$arm64_assets/init"        "$pkg/vmm/guest/init"
            cp "$arm64_assets/exec-agent"  "$pkg/vmm/guest/exec-agent"
          done
          mkdir -p packages/native-x64-linux/vmm/guest
          cp "$amd64_assets/init"        packages/native-x64-linux/vmm/guest/init
          cp "$amd64_assets/exec-agent"  packages/native-x64-linux/vmm/guest/exec-agent

      - name: Verify bundled-binary package shape
        run: bash scripts/verify-bin-packages.sh

      - name: Build TS packages
        run: pnpm -F @machinen/runtime -F @machinen/cli build

      - name: Publish pkg.pr.new canary packages
        run: >
          pnpm exec pkg-pr-new publish
          --commentWithSha
          --packageManager=pnpm
          --no-template
          './packages/cli'
          './packages/runtime'
          './packages/native-arm64-darwin'
          './packages/native-arm64-linux'
          './packages/native-x64-linux'
